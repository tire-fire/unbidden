name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: no warnings
        run: cargo build --locked --release 2>&1 | tee /tmp/build.log && ! grep -q '^warning' /tmp/build.log

  static:
    # /etc/ld.so.preload is a persistence mechanism: a dynamically linked
    # scanner runs the attacker's code before main(). A regression here is a
    # silent loss of that guarantee rather than a visible break, so it is
    # checked rather than trusted.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --locked --release --target ${{ matrix.target }}
      - name: the binary must be static
        run: |
          bin=target/${{ matrix.target }}/release/unbidden
          file "$bin"
          # rustc emits a static-PIE, which `file` calls "static-pie linked",
          # so both spellings count and anything else does not.
          file "$bin" | grep -qE 'static-pie linked|statically linked' \
            || { echo "not statically linked"; exit 1; }
          # ldd prints exactly one of two things for a static binary; any
          # other output is a shared object the binary needs.
          out=$(ldd "$bin" 2>&1 || true)
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "ldd reports dynamic linkage:"; echo "$out"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: unbidden-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/unbidden

  persistence:
    # The PANIX matrix needs a real boot, so it needs nested virtualisation.
    # Run it on demand rather than pretending every runner has KVM.
    if: github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, fedora-43, fedora-44]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - run: |
          chmod +x target/x86_64-unknown-linux-musl/release/unbidden
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso
          sudo chmod 666 /dev/kvm || true
      - run: ci/vm-harness.sh --image ${{ matrix.image }}

  desktop:
    # §13: an extension on disk runs only if dconf says so, and nothing
    # writes a dconf database until a session has run — so every headless
    # image in the matrix below skips the enablement half of the extension
    # collector without saying so. One image per desktop boots a real
    # session instead: Mint brings Cinnamon and Debian brings GNOME, which
    # is the pair §1 puts across the four supported distributions.
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: cinnamon
            image: linuxmintd/mint21-amd64
            packages: cinnamon-core
            expect: linuxmint
          - desktop: gnome
            image: debian:12
            packages: gnome-core
            expect: debian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: ./bin
      - run: chmod +x ./bin/unbidden
      - name: a ${{ matrix.desktop }} session on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e DEBIAN_FRONTEND=noninteractive \
            -e UNBIDDEN_DESKTOP=${{ matrix.desktop }} \
            -e UNBIDDEN_EXPECT_ID=${{ matrix.expect }} \
            ${{ matrix.image }} sh -c '
              apt-get -qq update >/dev/null &&
              apt-get -qq install -y --no-install-recommends \
                ${{ matrix.packages }} xvfb dbus-x11 xauth libgl1-mesa-dri procps \
                >/dev/null &&
              sh ci/distro-check.sh /w/bin/unbidden'

  distros:
    # The supported set from §1. A defect on any of these blocks a release.
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - fedora:latest
          - fedora:41
          # Mint publishes no cloud image, so the container matrix is the
          # only place §1's third distribution is tested at all. LMDE is a
          # separate image because it is a separate base: §13 wants the
          # Debian one read as Debian and not as Ubuntu.
          - linuxmintd/mint21-amd64
          - linuxmintd/lmde6-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: ./bin
      - run: chmod +x ./bin/unbidden
      - name: ${{ matrix.image }}
        run: |
          # Several distribution-named images are built on their upstream and
          # still report it: linuxmintd/mint22-amd64 is Ubuntu 24.04 down to
          # its os-release. Naming what the image is for turns that from a
          # hole in the matrix into a failure.
          case "${{ matrix.image }}" in
            *mint*|*lmde*) export UNBIDDEN_EXPECT_ID=linuxmint ;;
          esac
          docker run --rm -v "$PWD:/w" -w /w -e UNBIDDEN_EXPECT_ID ${{ matrix.image }} \
            sh ci/distro-check.sh /w/bin/unbidden
