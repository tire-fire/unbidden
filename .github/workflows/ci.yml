name: ci

# A change is pushed to a branch, tested there, and main is moved to it once
# green; there are no pull requests. A branch other than main gets the short
# tier, main and nightly the full one.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
  # The PANIX loop runs on main and nightly rather than on other branches, and
  # nightly also because a distribution image can change under an unchanged
  # tree.
  schedule:
    - cron: '17 4 * * *'

# A newer push to a branch makes its older run moot. The free plan runs
# twenty jobs at once, and a stale run holding them delays the current one.
# Runs on main are never cancelled: each one may be a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets
      - name: release build, with no warnings
        run: |
          set -o pipefail
          cargo build --locked --release 2>&1 | tee /tmp/build.log
          ! grep -q '^warning' /tmp/build.log

  lint:
    # The CI scripts are code that decides whether a release ships, and a
    # quoting mistake in one fails open as easily as closed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning ci/*.sh

  fuzz:
    # §13: every parser gets a cargo-fuzz target, and §3 is why — parser input
    # is adversarial, so "it does not panic" has to be exercised rather than
    # asserted. cargo-fuzz needs nightly for its sanitizer flags, which is the
    # one place this repository leaves the stable toolchain.
    #
    # It fails the run: a collector that panics is a whole mechanism class the
    # operator silently loses, and a fuzzer that cannot redden a build is
    # decoration. On main and nightly, a minute on each of the parsers §13
    # names and twenty seconds on every other; on another branch ten and five,
    # a smoke run of the smoke run, so the checks a change waits on stay short.
    # Either catches a shallow panic; the deep ones are what a corpus and a
    # real fuzzing host are for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # Named, because the prebuilt cargo-fuzz is a musl binary and would
      # otherwise build for musl, where the sanitizers cannot link.
      - run: cargo +nightly fuzz build -O --target x86_64-unknown-linux-gnu
      - name: every target
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            ci/fuzz-all.sh 10 5
          else
            ci/fuzz-all.sh 60 20
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  static:
    # /etc/ld.so.preload is a persistence mechanism: a dynamically linked
    # scanner runs the attacker's code before main(). A regression here is a
    # silent loss of that guarantee rather than a visible break, so it is
    # checked rather than trusted.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cross build --locked --release --target ${{ matrix.target }}
      - name: the binary must be static
        run: ci/static-check.sh target/${{ matrix.target }}/release/unbidden
      - uses: actions/upload-artifact@v4
        with:
          name: unbidden-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/unbidden

  persistence:
    # §13's PANIX loop, on every supported distribution that publishes a cloud
    # image, in a real VM: a real boot, a real systemd, a kernel of its own.
    # It gates a release, as §1 says every supported distribution does, so it
    # runs on every push to main, on tags and nightly. It is too slow for a
    # branch's checks to wait on: nine to fourteen minutes an image.
    needs: static
    if: github.ref_type != 'branch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, fedora-43, fedora-44]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - name: hardware virtualisation
        run: |
          # GitHub's Linux runners expose /dev/kvm to the kvm group only. It
          # is opened up directly rather than through a udev rule, which is
          # applied asynchronously and can lose a race with the check below.
          # Emulated, a Debian 12 run took 36 minutes against 6, so a runner
          # without KVM fails here instead. Nothing retries it: re-run the
          # failed job by hand, which lands it on another runner.
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
          ls -l /dev/kvm 2>&1 || true
          [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "no usable /dev/kvm on this runner"; exit 1; }
      - run: |
          chmod +x target/x86_64-unknown-linux-musl/release/unbidden
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso
      # The cloud image is two and a half minutes of download a run. A week's
      # copy is kept, since the distributions refresh their images too. The
      # VM boots from an overlay, so the cached base is never written.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: /var/tmp/unbidden-vm/cache/${{ matrix.image }}.qcow2
          key: vm-image-${{ matrix.image }}-${{ steps.week.outputs.week }}
      - run: ci/vm-harness.sh --image ${{ matrix.image }}

  persistence-mint:
    # Mint and LMDE publish no cloud image, so the same loop and the same live
    # checks run in a privileged container booted with systemd. lkm is the one
    # module a container cannot host, and the loop names it as not run. The
    # same loop as above, so it runs where that does.
    needs: static
    if: github.ref_type != 'branch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: linuxmintd/mint21-amd64
            expect: linuxmint:21
            args: ""
          - image: linuxmintd/mint22-amd64
            expect: linuxmint:22
            args: --mint-base-files
          - image: linuxmintd/lmde6-amd64
            expect: linuxmint:6
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - run: chmod +x target/x86_64-unknown-linux-musl/release/unbidden
      - name: ${{ matrix.image }}
        run: |
          bash ci/pull-image.sh ${{ matrix.image }}
          ci/container-harness.sh --image ${{ matrix.image }} --expect ${{ matrix.expect }} ${{ matrix.args }}

  desktop:
    # §13: an extension on disk runs only if dconf says so, and nothing
    # writes a dconf database until a session has run — so every headless
    # image in the matrix below skips the enablement half of the extension
    # collector without saying so. One image per desktop boots a real
    # session instead: Mint brings Cinnamon and Debian brings GNOME, which
    # is the pair §1 puts across the supported distributions.
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: cinnamon
            image: linuxmintd/mint21-amd64
            packages: cinnamon-core
            expect: linuxmint
          - desktop: gnome
            image: public.ecr.aws/docker/library/debian:12
            packages: gnome-core
            expect: debian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: ./bin
      - run: chmod +x ./bin/unbidden
      - name: a ${{ matrix.desktop }} session on ${{ matrix.image }}
        run: |
          bash ci/pull-image.sh ${{ matrix.image }}
          docker run --rm -v "$PWD:/w" -w /w \
            -e DEBIAN_FRONTEND=noninteractive \
            -e UNBIDDEN_DESKTOP=${{ matrix.desktop }} \
            -e UNBIDDEN_EXPECT_ID=${{ matrix.expect }} \
            ${{ matrix.image }} sh -c '
              apt-get -qq update >/dev/null &&
              apt-get -qq install -y --no-install-recommends \
                ${{ matrix.packages }} xvfb dbus-x11 xauth libgl1-mesa-dri procps \
                >/dev/null &&
              sh ci/distro-check.sh /w/bin/unbidden'

  distros:
    # The supported set from §1. A defect on any of these blocks a release.
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The official images come through AWS's mirror of the Docker
          # library. An anonymous Docker Hub pull is charged against the
          # runner's shared address, and this matrix made ten of them a run.
          # The Mint images are published nowhere else, so they stay.
          - image: public.ecr.aws/docker/library/debian:12
            # The one image that also waits out the install window, to check
            # that an edited maintainer script is noticed. Two minutes once
            # is enough; the ordering it depends on is dpkg's, not the image's.
            slow: "1"
          - image: public.ecr.aws/docker/library/debian:13
          - image: public.ecr.aws/docker/library/ubuntu:22.04
          - image: public.ecr.aws/docker/library/ubuntu:24.04
          # §1: current and current-1, pinned so a release does not silently
          # change what the matrix tested.
          - image: public.ecr.aws/docker/library/fedora:44
          - image: public.ecr.aws/docker/library/fedora:43
          # Mint publishes no cloud image, so the containers are the only
          # place §1's third distribution is tested without systemd running.
          # LMDE is a separate image because it is a separate base: §13
          # wants the Debian one read as Debian and not as Ubuntu.
          - image: linuxmintd/mint21-amd64
            expect_id: linuxmint
            expect_version: "21"
          # The published Mint 22 image carries Ubuntu's base-files and
          # reports Ubuntu 24.04. Mint's own base-files, from the Mint
          # repository its apt sources already name, makes it Mint 22. It has
          # to be asked for by release: Ubuntu's copy is a higher version, and
          # apt keeps an installed newer version over any pin below 1000.
          - image: linuxmintd/mint22-amd64
            expect_id: linuxmint
            expect_version: "22"
            prep: apt-get -qq update && apt-get -qq install -y --allow-downgrades base-files/wilma >/dev/null &&
          - image: linuxmintd/lmde6-amd64
            expect_id: linuxmint
            expect_version: "6"
          # §1: Alpine current and current-1, and 3.22, the last release on
          # apk 2 (the same installed database; its scripts archive is not
          # compressed). A bare image has no init system: openrc is what an
          # installed Alpine boots with, and what the plants below need.
          - image: public.ecr.aws/docker/library/alpine:3.24
            prep: apk add -q openrc busybox-openrc &&
          - image: public.ecr.aws/docker/library/alpine:3.23
            prep: apk add -q openrc busybox-openrc &&
          - image: public.ecr.aws/docker/library/alpine:3.22
            prep: apk add -q openrc busybox-openrc &&
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: ./bin
      - run: chmod +x ./bin/unbidden
      - name: ${{ matrix.image }}
        run: |
          bash ci/pull-image.sh ${{ matrix.image }}
          docker run --rm -v "$PWD:/w" -w /w \
            -e UNBIDDEN_EXPECT_ID=${{ matrix.expect_id }} \
            -e UNBIDDEN_EXPECT_VERSION=${{ matrix.expect_version }} \
            -e UNBIDDEN_SLOW_CHECKS=${{ matrix.slow }} \
            -e DEBIAN_FRONTEND=noninteractive \
            ${{ matrix.image }} sh -c '${{ matrix.prep }} sh ci/distro-check.sh /w/bin/unbidden'

  release:
    # A push to main whose Cargo.toml version has no tag yet is a release. A
    # README or workflow change that leaves the version alone releases nothing.
    # The version is chosen by editing Cargo.toml in a signed commit; this job
    # commits nothing. A hand-pushed vX.Y.Z tag releases exactly that version.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [test, lint, fuzz, static, desktop, distros, persistence, persistence-mint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance for what is posted, signed by GitHub's own identity
      # for this workflow run: no key of ours is involved.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: work out the version
        id: v
        run: |
          cur=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the run for main's tip releases. An older run's changes are
          # in the tip, whose own run releases them; two runs releasing at once
          # would both claim the next version, and an older run would compare
          # against a release tag that is not in its history.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA; the run for its tip releases"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release is a version Cargo.toml holds that has no tag yet. The
          # version is bumped in a signed commit alongside the change that
          # warrants it; this job commits nothing, so every commit on main
          # is one its author signed.
          if git rev-parse -q --verify "refs/tags/v$cur" >/dev/null; then
            echo "v$cur is already released; bump the version in Cargo.toml to release again"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$cur" >> "$GITHUB_OUTPUT"
      - name: build the binaries this release ships
        if: steps.v.outputs.skip != '1'
        # Built again here from the commit the tag will name, rather than taken
        # from the static job, which builds and checks the same commit. Each
        # target gets its own directory because cross runs each one in a
        # different container, and a host build script compiled against one
        # image's glibc will not run inside the other's.
        run: |
          cargo install cross --locked
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            rustup target add "$t"
            cross build --locked --release --target "$t" --target-dir "build-$t"
            bin=build-$t/$t/release/unbidden
            ci/static-check.sh "$bin"
            cp "$bin" "unbidden-$t"
          done
          # The same static binaries as a .deb and an .rpm for each architecture,
          # for hosts that would rather install with their package manager.
          v=${{ steps.v.outputs.version }}
          ci/package.sh unbidden-x86_64-unknown-linux-musl amd64 "$v" .
          ci/package.sh unbidden-aarch64-unknown-linux-musl arm64 "$v" .
          ci/package-check.sh "$v" .
          sha256sum unbidden-* unbidden_* > SHA256SUMS
          cat SHA256SUMS
      - name: tag it, now that the binaries exist
        id: tag
        if: steps.v.outputs.skip != '1' && github.ref_type != 'tag'
        run: |
          v=${{ steps.v.outputs.version }}
          # Asked again: the builds above take minutes, and a push to main in
          # the meantime makes this run the older one.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved past $GITHUB_SHA during the build; the run for its tip releases"
            exit 0
          fi
          # The tag names the commit this run tested; nothing is committed.
          # Pushed with GITHUB_TOKEN, which by design starts no further run.
          git tag "v$v"
          git push -q origin "v$v"
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: publish the crate
        if: steps.v.outputs.skip != '1' && (github.ref_type == 'tag' || steps.tag.outputs.pushed == '1')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # A version on crates.io can be yanked but never withdrawn, so a
        # rerun of this job must not attempt one that is already up.
        run: |
          v=${{ steps.v.outputs.version }}
          ua="unbidden-ci (github.com/tire-fire/unbidden)"
          if curl -sf -o /dev/null -H "User-Agent: $ua" \
               "https://crates.io/api/v1/crates/unbidden/$v"; then
            echo "$v is already on crates.io"
          else
            cargo publish --locked
          fi
      - name: attest what is posted
        if: steps.v.outputs.skip != '1' && (github.ref_type == 'tag' || steps.tag.outputs.pushed == '1')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            unbidden-*
            unbidden_*
            SHA256SUMS
      - name: post it
        if: steps.v.outputs.skip != '1' && (github.ref_type == 'tag' || steps.tag.outputs.pushed == '1')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${{ steps.v.outputs.version }}
          # A rerun, or a tag moved to a commit whose code is the same, finds
          # the release already posted.
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "v$v is already posted"
            exit 0
          fi
          gh release create "v$v" --generate-notes unbidden-* unbidden_* SHA256SUMS
