name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # The VM matrix is skipped on pull requests that do not touch the tool, so
  # it also runs nightly: a distribution image can change under an unchanged
  # tree.
  schedule:
    - cron: '17 4 * * *'

jobs:
  changes:
    # The VM matrix is the slowest part of a run, five to fifteen minutes a
    # job. A pull request that touches only prose waits for none of it.
    # Pushes to main, tags, the nightly run and a manual run always get it,
    # because a release is gated on it.
    runs-on: ubuntu-latest
    outputs:
      vm: ${{ steps.diff.outputs.vm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "vm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The whole pull request, not the latest push to it. A docs-only
          # push after a red VM run would otherwise mark those jobs skipped,
          # and a required check counts skipped as passing.
          if git diff --name-only "$BASE...$HEAD_SHA" | grep -qE '^(src/|Cargo\.(toml|lock)$|ci/|\.github/workflows/)'; then
            echo "vm=true" >> "$GITHUB_OUTPUT"
          else
            echo "vm=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: no warnings
        run: cargo build --locked --release 2>&1 | tee /tmp/build.log && ! grep -q '^warning' /tmp/build.log

  lint:
    # The CI scripts are code that decides whether a release ships, and a
    # quoting mistake in one fails open as easily as closed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning ci/*.sh

  fuzz:
    # §13: every parser gets a cargo-fuzz target, and §3 is why — parser input
    # is adversarial, so "it does not panic" has to be exercised rather than
    # asserted. cargo-fuzz needs nightly for its sanitizer flags, which is the
    # one place this repository leaves the toolchain in Cargo.toml.
    #
    # It fails the run: a collector that panics is a whole mechanism class the
    # operator silently loses, and a fuzzer that cannot redden a build is
    # decoration. A minute on each of the five §13 names first, twenty seconds
    # on every other parser: a smoke run, not a soak. It catches a shallow
    # panic on every push; the deep ones are what a corpus and a real fuzzing
    # host are for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build -O
      - name: every target
        run: |
          for t in $(cargo +nightly fuzz list); do
            case "$t" in
              unit_file|crontab|desktop_file|udev_rules|pam_config|shell_text) secs=60 ;;
              *) secs=20 ;;
            esac
            echo "::group::$t (${secs}s)"
            # -timeout turns a hang into a reported crash rather than a job
            # that runs until GitHub kills it; the two memory limits are how
            # "no unbounded memory" gets checked at all.
            cargo +nightly fuzz run -O "$t" -- \
              -max_total_time=$secs -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=512
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  static:
    # /etc/ld.so.preload is a persistence mechanism: a dynamically linked
    # scanner runs the attacker's code before main(). A regression here is a
    # silent loss of that guarantee rather than a visible break, so it is
    # checked rather than trusted.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --locked --release --target ${{ matrix.target }}
      - name: the binary must be static
        run: ci/static-check.sh target/${{ matrix.target }}/release/unbidden
      - uses: actions/upload-artifact@v4
        with:
          name: unbidden-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/unbidden

  persistence:
    # §13's PANIX loop, on every supported distribution that publishes a cloud
    # image, in a real VM: a real boot, a real systemd, a kernel of its own.
    # It gates a release, as §1 says every supported distribution does.
    needs: [static, changes]
    if: needs.changes.outputs.vm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, fedora-43, fedora-44]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - name: hardware virtualisation
        run: |
          # GitHub's Linux runners expose /dev/kvm to the kvm group only. It
          # is opened up directly rather than through a udev rule, which is
          # applied asynchronously and can lose a race with the check below.
          # Emulated, a Debian 12 run took 36 minutes against 6; a runner
          # without KVM fails here instead, and the job is re-run.
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
          ls -l /dev/kvm 2>&1 || true
          [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "no usable /dev/kvm on this runner"; exit 1; }
      - run: |
          chmod +x target/x86_64-unknown-linux-musl/release/unbidden
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso
      - run: ci/vm-harness.sh --image ${{ matrix.image }}

  persistence-mint:
    # Mint and LMDE publish no cloud image, so the same loop and the same live
    # checks run in a privileged container booted with systemd. lkm is the one
    # module a container cannot host, and the loop names it as not run.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: linuxmintd/mint21-amd64
            expect: linuxmint:21
            args: ""
          - image: linuxmintd/mint22-amd64
            expect: linuxmint:22
            args: --mint-base-files
          - image: linuxmintd/lmde6-amd64
            expect: linuxmint:6
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - run: chmod +x target/x86_64-unknown-linux-musl/release/unbidden
      - name: ${{ matrix.image }}
        run: |
          for i in 1 2 3; do docker pull ${{ matrix.image }} && break; sleep $((i * 10)); done
          ci/container-harness.sh --image ${{ matrix.image }} --expect ${{ matrix.expect }} ${{ matrix.args }}

  desktop:
    # §13: an extension on disk runs only if dconf says so, and nothing
    # writes a dconf database until a session has run — so every headless
    # image in the matrix below skips the enablement half of the extension
    # collector without saying so. One image per desktop boots a real
    # session instead: Mint brings Cinnamon and Debian brings GNOME, which
    # is the pair §1 puts across the four supported distributions.
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: cinnamon
            image: linuxmintd/mint21-amd64
            packages: cinnamon-core
            expect: linuxmint
          - desktop: gnome
            image: public.ecr.aws/docker/library/debian:12
            packages: gnome-core
            expect: debian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: ./bin
      - run: chmod +x ./bin/unbidden
      - name: a ${{ matrix.desktop }} session on ${{ matrix.image }}
        run: |
          # Any registry resets a connection now and then, and the pull is
          # the only part of this job that talks to one.
          pull() {
            for i in 1 2 3; do
              docker pull "$1" && return 0
              sleep $((i * 10))
            done
            return 1
          }
          pull ${{ matrix.image }}
          docker run --rm -v "$PWD:/w" -w /w \
            -e DEBIAN_FRONTEND=noninteractive \
            -e UNBIDDEN_DESKTOP=${{ matrix.desktop }} \
            -e UNBIDDEN_EXPECT_ID=${{ matrix.expect }} \
            ${{ matrix.image }} sh -c '
              apt-get -qq update >/dev/null &&
              apt-get -qq install -y --no-install-recommends \
                ${{ matrix.packages }} xvfb dbus-x11 xauth libgl1-mesa-dri procps \
                >/dev/null &&
              sh ci/distro-check.sh /w/bin/unbidden'

  distros:
    # The supported set from §1. A defect on any of these blocks a release.
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The official images come through AWS's mirror of the Docker
          # library. An anonymous Docker Hub pull is charged against the
          # runner's shared address, and this matrix made ten of them a run.
          # The Mint images are published nowhere else, so they stay.
          - image: public.ecr.aws/docker/library/debian:12
            # The one image that also waits out the install window, to check
            # that an edited maintainer script is noticed. Two minutes once
            # is enough; the ordering it depends on is dpkg's, not the image's.
            slow: "1"
          - image: public.ecr.aws/docker/library/debian:13
          - image: public.ecr.aws/docker/library/ubuntu:22.04
          - image: public.ecr.aws/docker/library/ubuntu:24.04
          # §1: current and current-1, pinned so a release does not silently
          # change what the matrix tested.
          - image: public.ecr.aws/docker/library/fedora:44
          - image: public.ecr.aws/docker/library/fedora:43
          # Mint publishes no cloud image, so the containers are the only
          # place §1's third distribution is tested without systemd running.
          # LMDE is a separate image because it is a separate base: §13
          # wants the Debian one read as Debian and not as Ubuntu.
          - image: linuxmintd/mint21-amd64
            expect_id: linuxmint
            expect_version: "21"
          # The published Mint 22 image carries Ubuntu's base-files and
          # reports Ubuntu 24.04. Mint's own base-files, from the Mint
          # repository its apt sources already name, makes it Mint 22. It has
          # to be asked for by release: Ubuntu's copy is a higher version, and
          # apt keeps an installed newer version over any pin below 1000.
          - image: linuxmintd/mint22-amd64
            expect_id: linuxmint
            expect_version: "22"
            prep: apt-get -qq update && apt-get -qq install -y --allow-downgrades base-files/wilma >/dev/null &&
          - image: linuxmintd/lmde6-amd64
            expect_id: linuxmint
            expect_version: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unbidden-x86_64-unknown-linux-musl
          path: ./bin
      - run: chmod +x ./bin/unbidden
      - name: ${{ matrix.image }}
        run: |
          # Any registry resets a connection now and then, and the pull is
          # the only part of this job that talks to one.
          pull() {
            for i in 1 2 3; do
              docker pull "$1" && return 0
              sleep $((i * 10))
            done
            return 1
          }
          pull ${{ matrix.image }}
          docker run --rm -v "$PWD:/w" -w /w \
            -e UNBIDDEN_EXPECT_ID=${{ matrix.expect_id }} \
            -e UNBIDDEN_EXPECT_VERSION=${{ matrix.expect_version }} \
            -e UNBIDDEN_SLOW_CHECKS=${{ matrix.slow }} \
            -e DEBIAN_FRONTEND=noninteractive \
            ${{ matrix.image }} sh -c '${{ matrix.prep }} sh ci/distro-check.sh /w/bin/unbidden'

  release:
    # A push to main that touched the tool is a release. A README or workflow
    # change is not a new version, so it is skipped rather than tagged. CI
    # only ever adds one to the patch: a minor or major bump is chosen by
    # editing the version in Cargo.toml, and CI then uses what it finds. A
    # hand-pushed vX.Y.Z tag releases exactly that version.
    if: github.event_name == 'push'
    needs: [test, lint, fuzz, static, desktop, distros, persistence, persistence-mint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: work out the version
        id: v
        run: |
          cur=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ] && ! git diff --name-only "$last"..HEAD \
               | grep -qE '^(src/|Cargo\.toml$|Cargo\.lock$)'; then
            echo "nothing under src/ since $last, so there is no new version"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Cargo.toml holding a version that was never tagged means someone
          # chose it; otherwise this is the next patch.
          if git rev-parse -q --verify "refs/tags/v$cur" >/dev/null; then
            cur=$(echo "$cur" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          fi
          echo "version=$cur" >> "$GITHUB_OUTPUT"
      - name: set the version the binaries will report
        if: steps.v.outputs.skip != '1' && github.ref_type != 'tag'
        run: |
          sed -i "0,/^version = /s/^version = .*/version = \"${{ steps.v.outputs.version }}\"/" Cargo.toml
          cargo metadata --no-deps --format-version 1 > /dev/null
      - name: build the binaries this release ships
        if: steps.v.outputs.skip != '1'
        # Not the artifacts from the static job: those were built before the
        # bump and would report the previous version to --version. Each target
        # gets its own directory because cross runs each one in a different
        # container, and a host build script compiled against one image's
        # glibc will not run inside the other's.
        run: |
          cargo install cross --locked
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            rustup target add "$t"
            cross build --locked --release --target "$t" --target-dir "build-$t"
            bin=build-$t/$t/release/unbidden
            ci/static-check.sh "$bin"
            cp "$bin" "unbidden-$t"
          done
          sha256sum unbidden-* > SHA256SUMS
          cat SHA256SUMS
      - name: tag it, now that the binaries exist
        if: steps.v.outputs.skip != '1' && github.ref_type != 'tag'
        run: |
          v=${{ steps.v.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The first release takes the version Cargo.toml already holds, so
          # there is nothing to commit and an unconditional commit would fail.
          if ! git diff --quiet; then
            git commit -qam "Release v$v"
          fi
          git tag "v$v"
          # Pushed with GITHUB_TOKEN, which by design starts no further run.
          git push -q origin HEAD:main "v$v"
      - name: post it
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --generate-notes unbidden-* SHA256SUMS
