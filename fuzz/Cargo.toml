# Deliberately its own workspace: §13 wants fuzz targets, but cargo-fuzz needs
# nightly for its sanitizer flags and the crate this repo publishes must build
# on the pinned stable in Cargo.toml. Keeping the two apart is what lets
# `cargo test --all-targets` and `cargo publish` at the root stay unaware of it.
[package]
name = "unbidden-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
unbidden = { path = ".." }
# Only for the rpm_header target, which writes the rpmdb its input goes into.
# The same version and features as the root crate, so the one libsqlite3-sys
# is shared.
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }

[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "unit_file"
path = "fuzz_targets/unit_file.rs"
test = false
doc = false
bench = false

