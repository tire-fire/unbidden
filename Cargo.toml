[package]
name = "unbidden"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Linux autostart and persistence enumerator"
repository = "https://github.com/tire-fire/unbidden"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["security", "forensics", "dfir", "persistence", "autostart"]

[dependencies]
blake3 = "1.8"
gvdb = "0.10.1"
zbus = "5.19"
md-5 = "0.10"
# apk's manifests are SHA-1; same publisher as sha2 and md-5.
sha1 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
clap = { version = "4", features = ["derive"] }
rustix = { version = "1.1", features = ["fs", "process", "system", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The bash grammar, for reading shell text a mechanism runs. Its parser is
# table-driven, so text nested fifty thousand deep parses in linear time
# instead of exhausting the stack, as the recursive-descent parsers did.
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
# Perl-style patterns some configurations filter with (munin-node's
# ignore_file); already built for tree-sitter.
regex = "1.13"
miniz_oxide = "0.9"

# cargo-binstall downloads the release's static binary instead of compiling.
# The releases carry musl builds only, so a host that reports a gnu target is
# sent to the musl file of its architecture: it is static and runs there.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/unbidden-{ target }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/unbidden-x86_64-unknown-linux-musl"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/unbidden-aarch64-unknown-linux-musl"

[profile.release]
lto = true
strip = true
