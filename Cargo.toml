[package]
name = "unbidden"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Linux autostart and persistence enumerator"
repository = "https://github.com/tire-fire/unbidden"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["security", "forensics", "dfir", "persistence", "autostart"]

[dependencies]
blake3 = "1.8"
gvdb = "0.10.1"
zbus = "5.19"
md-5 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
clap = { version = "4", features = ["derive"] }
rustix = { version = "1.1", features = ["fs", "process", "system", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
